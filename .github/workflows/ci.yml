name: Presyn CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compliance:
    name: Design & Governance Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Compliance and Design Rules Audit
        run: python scripts/audit_compliance.py

  backend:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest
    needs: compliance
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Runtime and Dev Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Verify Dependency Graph (pip check)
        run: pip check

      - name: Lint Backend Codebase (ruff)
        run: ruff check backend

      - name: Run Automated Backend Tests
        run: pytest

      - name: Verify Alembic Migration Lifecycle
        run: |
          python -c "import os, tempfile; from alembic.config import Config; from alembic import command; db_file = tempfile.NamedTemporaryFile(suffix='.db', delete=False).name; cfg = Config('backend/alembic.ini'); cfg.set_main_option('script_location', 'backend/migrations'); cfg.set_main_option('sqlalchemy.url', f'sqlite:///{db_file}'); command.upgrade(cfg, 'head'); command.downgrade(cfg, 'base'); command.upgrade(cfg, 'head'); print('Alembic migration smoke test passed.')"

  frontend:
    name: Frontend Build & Test Suite
    runs-on: ubuntu-latest
    needs: compliance
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Tests (Vitest)
        working-directory: frontend
        run: npm test

      - name: Build Production Frontend Bundle (Vite)
        working-directory: frontend
        run: npm run build
